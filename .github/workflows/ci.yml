name: Python CI

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pygame

      - name: Lint with flake8 (Optional)
        run: |
          pip install flake8
          # si ferma se ci sono errori di sintassi Python
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Check if script runs
        run: |
          # Questo comando verifica solo se ci sono errori di importazione 
          # senza aprire la finestra (che fallirebbe su un server senza monitor)
          python -m py_compile OfflineGamesMenu.py