name: Python CI

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"
  pull_request:
    branches: [main]
    paths-ignore:
      - "README.md"
      - "docs/**"

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Lint with flake8
        run: |
          flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
          flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics

      - name: Lint with pylint
        run: |
          # Analizza tutti i file .py nel repository
          pylint $(git ls-files '*.py')

      - name: Static type checking with mypy
        run: |
          # Verifica la coerenza dei tipi (es. se passi una stringa dove serve un int)
          # --ignore-missing-imports serve se alcune librerie non hanno i "type stubs"
          mypy --ignore-missing-imports $(git ls-files '*.py')

      - name: Check formatting with black
        run: black --check --diff .

      - name: Check imports with isort
        run: isort --check-only --diff .

      - name: Syntax Check (py_compile)
        run: python -m py_compile main_menu.py battaglia_navale/battleship.py sudoku/sudoku.py 